services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: automations
      POSTGRES_PASSWORD: automations
      POSTGRES_DB: automations
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automations -d automations"]
      interval: 2s
      timeout: 3s
      retries: 20
